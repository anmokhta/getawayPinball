<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machines | The Getaway Pinball Arcade</title>
    <link rel="icon" href="../assets/icon_transparent.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN) + local theme config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js"></script>

    <!-- Shared header/footer templates (must load before <site-header>/<site-footer> are parsed) -->
    <script src="../js/partials.js"></script>

    <!-- Site styles -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-background font-body-md text-on-background">
    <site-header></site-header>

    <main class="w-full">
      <div class="flex flex-col w-full">
        <!-- Hero -->
        <div class="max-w-[1440px] mx-auto w-full px-margin-mobile lg:px-margin-desktop pt-margin-mobile lg:pt-margin-desktop">
          <section class="relative w-full h-[60vh] md:h-[70vh] rounded-xl overflow-hidden">
            <div
              class="hero-bg-machines absolute inset-0 w-full h-full bg-cover bg-center scale-105 blur-sm opacity-30"
            ></div>
            <div
              class="absolute inset-0 bg-gradient-to-t from-background via-background/80 to-transparent"
            ></div>
            <div
              class="absolute inset-0 bg-gradient-to-r from-background via-background/40 to-transparent"
            ></div>

            <div class="absolute bottom-8 left-6 md:bottom-12 md:left-12 max-w-3xl pr-6">
              <div class="flex items-center gap-4 mb-4">
                <span class="w-12 h-px bg-accent-red neon-glow-red"></span>
                <span
                  class="font-label-sm text-label-sm text-accent-red uppercase tracking-[0.3em] neon-text-red"
                  >— The Arsenal</span
                >
              </div>
              <h1
                class="font-display-xl text-display-xl text-white uppercase leading-none tracking-tighter mb-6 drop-shadow-lg"
              >
                Every Table<br />
                <span class="text-accent-red neon-text-red">We've Got</span>
              </h1>
              <p class="font-body-lg text-body-lg text-on-surface-variant max-w-xl">
                World-class tables, precision maintained, and ready for battle
                — browse the full lineup on the floor right now.
              </p>
            </div>

            <div
              class="absolute right-8 top-1/2 -translate-y-1/2 hidden xl:block [writing-mode:vertical-rl] font-label-sm text-label-sm text-accent-red/40 tracking-[1em] uppercase"
            >
              Multiball // Tournament Ready
            </div>
          </section>
        </div>

        <!-- Filters / Sort (decorative — not yet wired up) -->
        <section class="w-full">
          <div class="max-w-[1440px] mx-auto px-margin-mobile lg:px-margin-desktop pt-16">
            <div
              class="flex flex-col md:flex-row items-center justify-between gap-6 bg-surface-container-high rounded-xl p-4 border border-white/5"
            >
              <div class="flex gap-4 overflow-x-auto w-full md:w-auto pb-2 md:pb-0">
                <button
                  class="px-6 py-2 bg-primary-container text-white font-label-sm text-label-sm uppercase tracking-widest whitespace-nowrap shadow-[0_0_15px_rgba(227,27,35,0.4)]"
                >
                  All Machines
                </button>
                <button
                  class="px-6 py-2 bg-transparent border border-outline text-on-surface hover:border-accent-red hover:text-accent-red transition-all font-label-sm text-label-sm uppercase tracking-widest whitespace-nowrap"
                >
                  Stern
                </button>
                <button
                  class="px-6 py-2 bg-transparent border border-outline text-on-surface hover:border-accent-red hover:text-accent-red transition-all font-label-sm text-label-sm uppercase tracking-widest whitespace-nowrap"
                >
                  Williams
                </button>
                <button
                  class="px-6 py-2 bg-transparent border border-outline text-on-surface hover:border-accent-red hover:text-accent-red transition-all font-label-sm text-label-sm uppercase tracking-widest whitespace-nowrap"
                >
                  Bally
                </button>
              </div>
              <div class="flex items-center gap-2 w-full md:w-auto">
                <span class="material-symbols-outlined text-on-surface-variant">search</span>
                <input
                  type="search"
                  id="machine-search"
                  placeholder="Search machines..."
                  class="bg-transparent border-b border-outline/40 text-on-surface font-label-sm text-label-sm py-1 focus:outline-none focus:border-accent-red w-full md:w-48 placeholder:text-on-surface-variant placeholder:normal-case"
                />
              </div>
            </div>
          </div>
        </section>

        <!-- Machine Grid -->
        <section class="w-full py-16">
          <div class="max-w-[1440px] mx-auto px-margin-mobile lg:px-margin-desktop">
            <p
              id="machine-search-empty"
              class="hidden font-body-md text-on-surface-variant text-center py-16"
            >
              No machines match your search.
            </p>
            <div id="machine-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter"></div>
          </div>
        </section>
      </div>
    </main>

    <site-footer></site-footer>

    <script src="../js/nav.js"></script>
    <script src="../js/pages/machines.js" type="module"></script>
  </body>
</html>
