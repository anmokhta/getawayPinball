<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Machines | The Getaway Pinball Arcade</title>
    <link rel="icon" href="../assets/icon_transparent.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN) + local theme config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js?v=3"></script>

    <!-- Shared header/footer templates (must load before <site-header>/<site-footer> are parsed) -->
    <script src="../js/partials.js?v=3"></script>

    <!-- Site styles -->
    <link rel="stylesheet" href="../css/style.css?v=3" />
    <link rel="stylesheet" href="../css/pages/machines.css?v=3" />
  </head>
  <body class="bg-background font-body-md text-on-background">
    <site-header></site-header>

    <main class="w-full">
      <div class="flex flex-col w-full">
        <!-- Hero -->
        <section class="hero-shell justify-center min-h-screen">
          <div class="absolute inset-0 z-0">
            <div class="hero-bg-machines hero-bg-layer"></div>
            <div class="hero-gradient-scrim"></div>
          </div>

          <div class="hero-left-container">
            <div class="flex items-center gap-4 mb-4">
              <span class="hero-eyebrow-rule"></span>
              <span class="hero-eyebrow-label">— The Arsenal</span>
            </div>
            <h1 class="hero-heading-sub">
              Every Machine<br />
              <span class="text-accent-red neon-text-red">We've Got</span>
            </h1>
            <p class="hero-lede">
              World-class tables, precision maintained, and ready for battle
              - browse the full lineup on the floor right now.
            </p>
          </div>

          <div class="decorative-vertical-text">
            Multiball // Tournament Ready
          </div>
        </section>

        <!-- Filters / Sort / Search / View -->
        <section class="w-full">
          <div class="section-container pt-16">
            <div
              class="flex flex-col md:flex-row md:flex-wrap md:items-center md:justify-between gap-3 bg-surface-container-high rounded-xl p-4 border border-white/5"
            >
              <div class="flex items-center gap-3 order-2 md:order-1">
                <!-- Filter -->
                <div class="relative" id="machine-filter-dropdown">
                  <button
                    type="button"
                    id="machine-filter-toggle"
                    aria-haspopup="true"
                    aria-expanded="false"
                    class="toolbar-btn toolbar-text-btn"
                  >
                    <span>Filter</span>
                    <span class="material-symbols-outlined text-[18px]">expand_more</span>
                  </button>
                  <div
                    id="machine-filter-menu"
                    role="menu"
                    aria-label="Filter machines by manufacturer"
                    class="toolbar-dropdown hidden"
                  >
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="true" data-filter="all">
                      <span>All Machines</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="false" data-filter="stern">
                      <span>Stern</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="false" data-filter="williams">
                      <span>Williams</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="false" data-filter="bally">
                      <span>Bally</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="false" data-filter="others">
                      <span>Others</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                  </div>
                </div>

                <!-- Sort -->
                <div class="relative" id="machine-sort-dropdown">
                  <button
                    type="button"
                    id="machine-sort-toggle"
                    aria-haspopup="true"
                    aria-expanded="false"
                    class="toolbar-btn toolbar-text-btn"
                  >
                    <span>Sort</span>
                    <span class="material-symbols-outlined text-[18px]">expand_more</span>
                  </button>
                  <div
                    id="machine-sort-menu"
                    role="menu"
                    aria-label="Sort machines"
                    class="toolbar-dropdown hidden"
                  >
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="true" data-sort="alphabetical">
                      <span>Alphabetical (A to Z)</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="false" data-sort="reverse-alphabetical">
                      <span> Alphabetical (Z to A)</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="false" data-sort="year-oldest">
                      <span>Year (Oldest First)</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                    <button type="button" class="toolbar-dropdown-item" role="menuitemradio" aria-checked="false" data-sort="year-newest">
                      <span>Year (Newest First)</span>
                      <span class="material-symbols-outlined toolbar-dropdown-check text-[18px]">check</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="flex items-center gap-3 order-1 md:order-2">
                <!-- Search -->
                <!--
                  Two nested wrappers on purpose: the outer one owns the tooltip
                  (must NOT clip overflow, or the tooltip bubble above it would
                  be cut off) and the inner one owns the expand/collapse
                  animation (MUST clip overflow, to hide the input off to the
                  side while collapsed).

                  On mobile the search field is always shown expanded (see
                  CSS), so it also grows (flex-1) to fill the row alongside
                  the View button instead of sitting at its collapsed 44px.
                -->
                <div class="relative flex-1 min-w-0 md:flex-none" id="machine-search-tooltip-wrapper" data-tooltip="Search">
                  <div
                    id="machine-search-wrapper"
                    class="flex items-center h-11 w-11 bg-surface-container-highest border border-outline/40 overflow-hidden transition-all duration-300 focus-within:border-accent-red"
                  >
                    <button
                      type="button"
                      id="machine-search-toggle"
                      aria-expanded="false"
                      aria-label="Search machines"
                      class="shrink-0 flex items-center justify-center w-11 h-11 text-on-surface-variant hover:text-accent-red transition-colors"
                    >
                      <span class="material-symbols-outlined text-[20px]" id="machine-search-toggle-icon">search</span>
                    </button>
                    <input
                      type="search"
                      id="machine-search"
                      placeholder="Search machines..."
                      class="bg-transparent border-0 shadow-none focus:ring-0 flex-1 min-w-0 text-on-surface font-label-sm text-label-sm uppercase tracking-widest p-0 pr-4 focus:outline-none placeholder:text-on-surface-variant placeholder:uppercase"
                    />
                  </div>
                </div>

                <!-- TODO(remove): local test sync button — also remove /__dev/sync-machines in scripts/dev-server.js -->
                <button
                  type="button"
                  id="machine-sync-test-toggle"
                  aria-label="Sync from Pinball Map (local)"
                  data-tooltip="Sync from Pinball Map (local)"
                  class="toolbar-btn toolbar-icon-btn"
                >
                  <span class="material-symbols-outlined text-[20px]">refresh</span>
                </button>

                <!-- View -->
                <button
                  type="button"
                  id="machine-view-toggle"
                  aria-pressed="false"
                  aria-label="Switch to list view"
                  data-tooltip="Switch to list view"
                  class="toolbar-btn toolbar-icon-btn"
                >
                  <span class="material-symbols-outlined text-[20px]">view_list</span>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Machine Grid -->
        <section class="w-full py-16">
          <div class="section-container">
            <p
              id="machine-search-empty"
              class="hidden font-body-md text-on-surface-variant text-center py-16"
            >
              No machines match your search.
            </p>
            <div id="machine-grid">
              <div class="list grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter"></div>
            </div>
            <p class="mt-10 font-body-md text-on-surface-variant text-center text-sm">
              Machine list from
              <a
                href="https://pinballmap.com/map/?by_location_id=30142"
                class="text-accent-red hover:underline"
                rel="noopener noreferrer"
                target="_blank"
                >Pinball Map</a
              >
              — update this location listing there.
            </p>
          </div>
        </section>
      </div>
    </main>

    <site-footer></site-footer>

    <script src="https://cdn.jsdelivr.net/npm/list.js@2.3.1/dist/list.min.js"></script>
    <script src="../js/nav.js?v=3"></script>
    <script src="../js/pages/machines.js?v=3" type="module"></script>
  </body>
</html>
