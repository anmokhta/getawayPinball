name: Sync drinks menu

on:
  schedule:
    # Every 6 hours — keeps the data/drinks.json fallback snapshot fresh in
    # case the live sheet fetch on the site ever fails.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync drinks.json from the Google Sheet
        run: node scripts/sync-drinks.js

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/drinks.json; then
            echo "No changes to data/drinks.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/drinks.json
          git commit -m "chore: sync drinks menu from Google Sheet"
          git push
