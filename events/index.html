<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | The Getaway Pinball Arcade</title>
    <link rel="icon" href="../assets/icon_transparent.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN) + local theme config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js"></script>

    <!-- Shared header/footer templates (must load before <site-header>/<site-footer> are parsed) -->
    <script src="../js/partials.js"></script>

    <!-- Site styles -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body class="bg-background font-body-md text-on-background">
    <site-header></site-header>

    <main class="w-full">
      <section
        class="w-full min-h-[60vh] flex flex-col items-center justify-center text-center py-32 px-margin-mobile"
      >
        <span
          class="font-label-sm text-label-sm text-accent-red uppercase tracking-widest neon-text-red mb-4"
          >— The Circuit</span
        >
        <h1 class="font-display-xl text-display-xl text-white uppercase tracking-tighter">
          Coming Soon
        </h1>
      </section>
    </main>

    <site-footer></site-footer>

    <script src="../js/nav.js"></script>
    <script src="../js/main.js" defer></script>
  </body>
</html>
