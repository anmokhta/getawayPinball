<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | The Getaway Pinball Arcade</title>
    <link rel="icon" href="../assets/icon_transparent.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN) + local theme config -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="../js/tailwind-config.js?v=3"></script>

    <!-- Shared header/footer templates (must load before <site-header>/<site-footer> are parsed) -->
    <script src="../js/partials.js?v=3"></script>

    <!-- Site styles -->
    <link rel="stylesheet" href="../css/style.css?v=3" />
  </head>
  <body class="bg-background font-body-md text-on-background">
    <site-header></site-header>

    <main class="w-full">
      <section
        class="hero-shell min-h-screen items-center justify-center text-center px-margin-mobile"
      >
        <div class="absolute inset-0 z-0">
          <div class="hero-bg-home hero-bg-layer"></div>
          <div class="hero-gradient-scrim"></div>
        </div>

        <div class="relative z-20">
          <span class="section-eyebrow-label mb-4 inline-block">— The Circuit</span>
          <h1 class="font-display-xl text-[clamp(48px,7.8vw,80px)] font-black text-white uppercase tracking-tighter">
            Coming Soon
          </h1>
        </div>

        <div class="decorative-vertical-text">
          League Nights // Soon
        </div>
      </section>
    </main>

    <site-footer></site-footer>

    <script src="../js/nav.js?v=3"></script>
  </body>
</html>
